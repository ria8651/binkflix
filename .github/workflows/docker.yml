name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # .git is dockerignored, so pass the build id explicitly.
      - id: build-id
        run: echo "id=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The Dockerfile's RUN --mount=type=cache dirs (cargo registry, target/,
      # dx tools) aren't covered by the gha layer cache. Persist them through
      # actions/cache and inject them into BuildKit with buildkit-cache-dance.
      # Keyed per commit so every build saves its target/; restore falls back
      # to the newest entry for the same Cargo.lock, then to any entry.
      - uses: actions/cache@v4
        with:
          path: cache-mount
          key: cache-mount-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cache-mount-${{ hashFiles('Cargo.lock') }}-
            cache-mount-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/cargo-registry": "/usr/local/cargo/registry",
              "cache-mount/cargo-git": "/usr/local/cargo/git",
              "cache-mount/target": { "target": "/src/target", "id": "binkflix-target" },
              "cache-mount/dioxus": "/root/.cache/dioxus"
            }

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BINKFLIX_BUILD_ID=${{ steps.build-id.outputs.id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
